<!DOCTYPE html>
<html lang="en"
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group 2: Images & Multimedia Gallery</title>
    <style>
        body{
            font-family: Arial, sans serif;
            line-height: 1.6;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1, h2{
            color: #2c3e50;
        }
        .gallery-container{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        figure{
            margin: 0;
            background: #fff;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        img{
            max-width: 100%;
            height: auto;
            border-radius: 3px;
        }
        figcaption{
            font-size:0.9em;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }
        .media-section{
            background: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        video, audio{
            width: 100%;
            max-width: 600px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Image & Multimedia Gallery</h1>
    <p>Welcome to the Group 2 showcase featuring responsive images, HTML '<pictures>' elements, embedded videos, and audio controls.</p>

    <!-- Requirement 1 & Bonus: Images and <picture> element-->
    <h2>Image Gallery</h2>
    <div class="gallery-container">

        <!-- Image 1: Using the <picture> element bonus for different screen sizes  -->
        <figure>
            <picture>
                <source media="(min-width: 800px)" srcset="https://picsum.photos/id/1015/800/400">
                <img src="https://picsum.photos/id/1015/400/200" alt="Scenic view of a mountain river winding through a valley">
            </picture>
            <figcaption>Figure 1:Responsive mountain landscape served via the picture element.</figcaption>
        </figure>

        <!-- Image 2: Local/External source with descriptive alt text -->
        <div>
            <img src="https://picsum.photos/id/1062/400/200" alt="A cute golden retriever puppy sitting attentively outdoors">
        </div>

        <!-- Image 3: External source wit descriptive alt text -->
        <div>
            <img src="https://picsum.photos/id/1062/400/200" alt="Close-up of vibrant green moss growing on a forest floor rock">
        </div>
    </div>

    <!-- Requirement 2: Embedded Youtube video and Audio file -->
    <div class="media-section">
        <h2>Multimedia Integration</h2>
        
        <div>
            <h3>Youtube Video Embedding</h3>
            <!-- Embedded Youtube Video using iframe -->
            <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Youtube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <div style="margin-top: 20px;">
            <h3>Audio Element with Playback Controls</h3>
            <!-- Audio file with playback controls enabled -->
            <audio controls>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                Your browser does not support audio element.
            </audio>
        </div>

    </div>
</body>
</html>
